---
layout: default
title: Analyst Watch
permalink: /analysts/
---

<style>
  .analyst-watch-page {
    padding: 4rem 0 6rem;
    font-family: 'IBM Plex Mono', monospace;
  }
  
  .aw-header {
    max-width: 640px;
    margin: 0 auto 48px;
  }
  
  .aw-eyebrow {
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 8px;
  }
  
  .aw-title {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: 32px;
    margin: 0 0 12px 0;
    color: var(--text);
  }
  
  .aw-sub {
    color: var(--text-dim);
    font-size: 14px;
    line-height: 1.6;
  }
  
  #feed {
    max-width: 640px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 32px;
  }
  
  .entry {
    border: 1px solid var(--border);
    background: var(--surface);
    padding: 24px;
    border-radius: 4px;
  }
  
  .entry-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 16px;
    gap: 12px;
  }
  
  .author {
    font-size: 14px;
    color: var(--text);
    font-weight: 600;
  }
  
  .date {
    font-size: 11px;
    color: var(--text-muted);
    white-space: nowrap;
  }
  
  .bluf {
    font-family: 'Playfair Display', serif;
    font-size: 18px;
    line-height: 1.45;
    color: var(--text);
    margin-bottom: 16px;
    padding-left: 16px;
    border-left: 2px solid var(--accent);
  }
  
  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 16px;
  }
  
  .tag {
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent);
    border: 1px solid var(--accent-mid);
    padding: 3px 10px;
    border-radius: 3px;
  }
  
  .note {
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 16px;
    line-height: 1.6;
  }
  
  .tweet-embed {
    max-width: 100%;
    border-radius: 8px;
    overflow: hidden;
  }
  
  .empty, .loading {
    max-width: 640px;
    margin: 0 auto;
    color: var(--text-muted);
    font-size: 14px;
    text-align: center;
    padding: 60px 0;
  }
</style>

<div class="analyst-watch-page">
  <header class="aw-header">
    <div class="aw-eyebrow">Somali OSINT Brief</div>
    <h1 class="aw-title">Analyst Watch</h1>
    <div class="aw-sub">Curated posts from Horn of Africa geopolitics and security analysts on X, scored and summarized as they're logged.</div>
  </header>

  <div id="feed">
    <div class="loading">Loading feed...</div>
  </div>
</div>

<script src="https://platform.twitter.com/widgets.js" async></script>
<script>
  // Data sourced from: /analysts/data.json
  const DATA_URL = '/analysts/data.json';

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  function formatDate(iso) {
    try {
      return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    } catch { return ''; }
  }

  async function loadFeed() {
    const feed = document.getElementById('feed');
    try {
      const res = await fetch(DATA_URL + '?_=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) throw new Error('fetch failed');
      const entries = await res.json();

      if (!entries || !entries.length) {
        feed.innerHTML = '<div class="empty">No posts logged yet.</div>';
        return;
      }

      feed.innerHTML = entries.map(e => `
        <div class="entry">
          <div class="entry-header">
            <span class="author">${escapeHtml(e.author)}</span>
            <span class="date">${formatDate(e.addedAt)}</span>
          </div>
          ${e.bluf ? `<div class="bluf">${escapeHtml(e.bluf)}</div>` : ''}
          ${e.tags && e.tags.length ? `<div class="tags">${e.tags.map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')}</div>` : ''}
          ${e.note ? `<div class="note">${escapeHtml(e.note)}</div>` : ''}
          <div class="tweet-embed">
            <blockquote class="twitter-tweet" data-theme="dark" data-conversation="none">
              <a href="${e.url}"></a>
            </blockquote>
          </div>
        </div>
      `).join('');

      if (window.twttr && window.twttr.widgets) {
        window.twttr.widgets.load(feed);
      }
    } catch (err) {
      feed.innerHTML = '<div class="empty">Could not load the feed. Try refreshing. (Error: ' + err.message + ')</div>';
    }
  }

  loadFeed();
</script>
